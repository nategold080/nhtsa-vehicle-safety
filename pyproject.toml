[project]
name = "nhtsa-vehicle-safety"
version = "1.0.0"
description = "NHTSA Vehicle Safety Defect Tracker — Cross-linked complaints, investigations, recalls, and TSBs"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "openpyxl>=3.1",
    "streamlit>=1.30",
    "plotly>=5.18",
    "pandas>=2.1",
]

[project.scripts]
nhtsa = "src.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
